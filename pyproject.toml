[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blq-cli"
version = "2.0.0"
description = "Build Log Query - capture and query build/test logs with DuckDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Teague Sterling", email = "teaguesterling@gmail.com" }
]
keywords = ["duckdb", "logs", "build", "test", "ci", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # Upper bound: duckdb 2.0 removed DuckDBPyRelation.fetchone() and tightened
    # connection reuse, which fails 71 of this suite's tests (24 AttributeError,
    # 18 ResourceInUseException). Measured 2026-11-03 on py3.12.3 and py3.13.13
    # with a clean HOME. CI never caught it: the 3.10 leg resolves 1.5.6, fails
    # first, and matrix fail-fast cancels the 3.11/3.12 legs that do get 2.0.
    "duckdb>=1.4.4,<2",
    "jinja2>=3.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "tomli>=2.0.0;python_version<'3.11'",
    # pydantic will not build a schema from `typing.TypedDict` below 3.12, so
    # the MCP tools' output schemas need the backport there.
    "typing_extensions>=4.0;python_version<'3.12'",
    "tomli-w>=1.0.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "fastmcp>=2.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]
mcp = [
    "fastmcp>=2.0.0",
]

[project.scripts]
blq = "blq.cli:main"

[project.urls]
Homepage = "https://blq-cli.readthedocs.io/"
Repository = "https://github.com/teaguesterling/blq-cli"
Issues = "https://github.com/teaguesterling/blq-cli/issues"

[project.entry-points."blq.extensions"]
sandbox = "blq_sandbox:SandboxExtension"

[project.entry-points."blq.annotators"]
source_context = "blq_sandbox.source_annotator:SourceContextAnnotator"

[project.entry-points."blq.sandbox.engines"]
systemd = "blq_sandbox_systemd:SystemdEngine"
bwrap = "blq_sandbox_bwrap:BwrapEngine"

[tool.hatch.build.targets.wheel]
packages = ["src/blq", "src/blq_sandbox", "src/blq_sandbox_systemd", "src/blq_sandbox_bwrap"]

[tool.ruff]
target-version = "py310"
line-length = 100
# ruff formats Python code blocks inside markdown too. In this repo that
# collapses the aligned trailing comments the docs use as a two-column
# listing, so `ruff format --check .` reported 19 documentation files as
# unformatted. Excluding markdown keeps the docs as written; ruff's lint
# rules never applied to them anyway.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
